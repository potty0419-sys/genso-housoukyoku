name: GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test
        run: node --test tests/fetch_youtube.test.mjs tests/site_data.test.mjs tests/store.test.mjs
      - name: Fetch YouTube data
        if: ${{ env.YOUTUBE_API_KEY != '' }}
        continue-on-error: true
        run: node scripts/fetch_youtube.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - uses: actions/deploy-pages@v4
        id: deployment
